name: Build and Test (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows MSVC (JUCE + CMake)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache JUCE Framework
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: JUCE
          key: ${{ runner.os }}-juce-7.0.12

      - name: Fetch JUCE (if not cached)
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git JUCE

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.25.x'

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build LoopStation & Unit Tests
        run: |
          cmake --build build --config Release

      - name: Run Automated Test Suite
        run: |
          .\build\LoopStation_Tests_artefacts\Release\LoopStation_Tests.exe
